<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FunData settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 id="title"></h1>

  <div class="field">
    <label id="label-language" for="language"></label>
    <select id="language"></select>
  </div>

  <div class="field">
    <span id="label-score-display" class="field-label"></span>
    <label class="radio">
      <input type="radio" name="scoreDisplay" value="emoji">
      <span id="label-emoji"></span>
    </label>
    <label class="radio">
      <input type="radio" name="scoreDisplay" value="labels">
      <span id="label-labels"></span>
    </label>
  </div>

  <div class="field">
    <span id="label-map-mode" class="field-label"></span>
    <label class="radio">
      <input type="radio" name="mapMode" value="dynamic">
      <span id="label-dynamic"></span>
    </label>
    <label class="radio">
      <input type="radio" name="mapMode" value="static">
      <span id="label-static"></span>
    </label>
  </div>

  <div class="field">
    <span id="label-theme" class="field-label"></span>
    <label class="radio">
      <input type="radio" name="theme" value="auto">
      <span id="label-theme-auto"></span>
    </label>
    <label class="radio">
      <input type="radio" name="theme" value="light">
      <span id="label-theme-light"></span>
    </label>
    <label class="radio">
      <input type="radio" name="theme" value="dark">
      <span id="label-theme-dark"></span>
    </label>
  </div>

  <div class="field">
    <span id="label-toolbar" class="field-label"></span>
    <label class="radio">
      <input type="radio" name="toolbarMode" value="panel">
      <span id="label-toolbar-panel"></span>
    </label>
    <label class="radio">
      <input type="radio" name="toolbarMode" value="popup">
      <span id="label-toolbar-popup"></span>
    </label>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
